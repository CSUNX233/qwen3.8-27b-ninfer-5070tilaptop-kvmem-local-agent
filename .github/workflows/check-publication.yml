name: publication checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate release metadata and public docs
        run: python scripts/check-release.py
      - name: Check cache guard streaming and cancellation
        run: node --test integrations/tests/cache-guard.test.mjs
      - name: Install pinned dsh dependencies for tool pipeline checks
        working-directory: integrations/dsh
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check screenshot continuation through the real dsh pipeline
        run: node --test integrations/tests/tool-grounded-execution.test.mjs
      - name: Parse PowerShell and JavaScript
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath . -File -Filter '*.ps1') + @(Get-ChildItem -LiteralPath scripts -File -Filter '*.ps1')
          foreach ($file in $files) {
            $tokens = $null; $errors = $null
            $null = [Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors) { throw ($errors | Out-String) }
          }
          $js = @(git ls-files --cached --others --exclude-standard -- '*.mjs')
          foreach ($file in $js) { node --check $file; if ($LASTEXITCODE) { throw $file } }
