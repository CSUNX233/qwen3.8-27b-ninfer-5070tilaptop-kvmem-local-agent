<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · tihuriding</title>
<style>
  body{
    margin:0; min-height:100vh; box-sizing:border-box; padding:24px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:linear-gradient(180deg,#e7f3fa,#edf5e8);
    font-family:"Segoe UI",system-ui,sans-serif;
  }
  .stage{
    width:min(960px,100%); background:#fff; border-radius:16px; padding:18px;
    box-shadow:0 10px 30px rgba(30,60,90,.12);
  }
  h1{font-size:20px; margin:4px 6px 10px; color:#2c3e50; font-weight:600;}
  svg{width:100%; height:auto; display:block; border-radius:12px; background:#bfe3f5;}
  .caption{margin:10px 6px 2px; font-size:13px; color:#6b7f8f;}

  /* ---- 背景动画 ---- */
  @keyframes drift{ from{transform:translateX(950px);} to{transform:translateX(-260px);} }
  .cloud-a,.cloud-b,.cloud-c{fill:#fff;}
  .cloud-a{animation:drift 38s linear infinite; animation-delay:-14s;}
  .cloud-b{animation:drift 52s linear infinite; animation-delay:-30s;}
  .cloud-c{animation:drift 66s linear infinite; animation-delay:-8s;}

  @keyframes spinSun{ to{transform:rotate(360deg);} }
  .sun-rays{transform-origin:810px 84px; animation:spinSun 42s linear infinite;}

  @keyframes roaddash{ to{stroke-dashoffset:48;} }
  .road-dash{animation:roaddash .667s linear infinite;}

  @keyframes streak{ from{transform:translateX(0);opacity:.55;} to{transform:translateX(-18px);opacity:.12;} }
  .streak{stroke:#fff; stroke-width:3; stroke-linecap:round;}
  .streak.s1{animation:streak 1.5s ease-in-out infinite alternate;}
  .streak.s2{animation:streak 1.5s ease-in-out .5s infinite alternate;}
  .streak.s3{animation:streak 1.5s ease-in-out 1s infinite alternate;}

  @media (prefers-reduced-motion: reduce){
    .cloud-a,.cloud-b,.cloud-c,.sun-rays,.road-dash,.streak.s1,.streak.s2,.streak.s3{animation:none;}
  }
</style>
</head>
<body>
<div class="stage">
  <h1>鹈鹕骑自行车 🚲</h1>
  <svg id="scene" viewBox="0 0 900 520" role="img" aria-label="一只鹈鹕骑着自行车的二维动画">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#a9ddf4"/>
        <stop offset="1" stop-color="#e9f7fe"/>
      </linearGradient>
    </defs>

    <!-- 天空与远景 -->
    <rect x="0" y="0" width="900" height="416" fill="url(#sky)"/>

    <g class="sun-rays" stroke="#ffcf3f" stroke-width="5" stroke-linecap="round">
      <line x1="846" y1="84" x2="860" y2="84"/>
      <line x1="835.5" y1="109.5" x2="845.4" y2="119.4"/>
      <line x1="810" y1="120" x2="810" y2="134"/>
      <line x1="784.5" y1="109.5" x2="774.6" y2="119.4"/>
      <line x1="774" y1="84" x2="760" y2="84"/>
      <line x1="784.5" y1="58.5" x2="774.6" y2="48.6"/>
      <line x1="810" y1="48" x2="810" y2="34"/>
      <line x1="835.5" y1="58.5" x2="845.4" y2="48.6"/>
    </g>
    <circle cx="810" cy="84" r="30" fill="#ffd94d"/>

    <g class="cloud-a"><g transform="translate(150 92)">
      <ellipse cx="0" cy="0" rx="28" ry="14"/><ellipse cx="22" cy="-6" rx="22" ry="12"/><ellipse cx="-20" cy="-4" rx="20" ry="11"/>
    </g></g>
    <g class="cloud-b"><g transform="translate(480 150) scale(.8)">
      <ellipse cx="0" cy="0" rx="28" ry="14"/><ellipse cx="22" cy="-6" rx="22" ry="12"/><ellipse cx="-20" cy="-4" rx="20" ry="11"/>
    </g></g>
    <g class="cloud-c"><g transform="translate(720 70) scale(1.15)">
      <ellipse cx="0" cy="0" rx="28" ry="14"/><ellipse cx="22" cy="-6" rx="22" ry="12"/><ellipse cx="-20" cy="-4" rx="20" ry="11"/>
    </g></g>

    <path d="M -20 416 Q 130 348 320 416 Z" fill="#bfe0b0"/>
    <path d="M 480 416 Q 690 338 920 416 Z" fill="#cde8bf"/>

    <!-- 道路与草地 -->
    <rect x="0" y="416" width="900" height="26" fill="#5d6069"/>
    <line x1="0" y1="416.5" x2="900" y2="416.5" stroke="#474a52" stroke-width="1"/>
    <line class="road-dash" x1="-60" y1="429" x2="960" y2="429" stroke="#eef1f2" stroke-width="4" stroke-dasharray="28 20"/>
    <rect x="0" y="442" width="900" height="78" fill="#8cb874"/>

    <!-- 速度线 -->
    <line class="streak s1" x1="40" y1="300" x2="122" y2="300"/>
    <line class="streak s2" x1="18" y1="346" x2="104" y2="346"/>
    <line class="streak s3" x1="52" y1="392" x2="132" y2="392"/>

    <!-- 远侧腿（在车架后面） -->
    <g id="farLeg">
      <path id="farThigh" d="" stroke="#b06e24" stroke-width="13" stroke-linecap="round" fill="none"/>
      <path id="farCalf"  d="" stroke="#b06e24" stroke-width="8.5" stroke-linecap="round" fill="none"/>
      <g id="farPlate">
        <line x1="405" y1="368" x2="439" y2="368" stroke="#8a8a8a" stroke-width="4"/>
        <rect x="424" y="365" width="30" height="6" rx="3" fill="#8f8f8f"/>
        <ellipse cx="439" cy="359.5" rx="8" ry="5" fill="#9c5e1c"/>
      </g>
    </g>

    <!-- 后轮 -->
    <g id="wheelB">
      <circle cx="300" cy="358" r="58" fill="none" stroke="#34373c" stroke-width="7"/>
      <circle cx="300" cy="358" r="45.5" fill="none" stroke="#a9aeb4" stroke-width="2"/>
      <g id="spokesB" stroke="#9ba0a6" stroke-width="2.4">
        <line x1="300" y1="358" x2="340" y2="358"/>
        <line x1="300" y1="358" x2="300" y2="398"/>
        <line x1="300" y1="358" x2="260" y2="358"/>
        <line x1="300" y1="358" x2="300" y2="318"/>
        <line x1="300" y1="358" x2="328.3" y2="386.3"/>
        <line x1="300" y1="358" x2="328.3" y2="329.7"/>
        <line x1="300" y1="358" x2="271.7" y2="386.3"/>
        <line x1="300" y1="358" x2="271.7" y2="329.7"/>
      </g>
      <circle cx="300" cy="358" r="5.5" fill="#5c5f66"/>
      <circle cx="300" cy="358" r="2.4" fill="#8a8d93"/>
    </g>

    <!-- 前轮 -->
    <g id="wheelF">
      <circle cx="560" cy="358" r="58" fill="none" stroke="#34373c" stroke-width="7"/>
      <circle cx="560" cy="358" r="45.5" fill="none" stroke="#a9aeb4" stroke-width="2"/>
      <g id="spokesF" stroke="#9ba0a6" stroke-width="2.4">
        <line x1="560" y1="358" x2="600" y2="358"/>
        <line x1="560" y1="358" x2="560" y2="398"/>
        <line x1="560" y1="358" x2="520" y2="358"/>
        <line x1="560" y1="358" x2="560" y2="318"/>
        <line x1="560" y1="358" x2="588.3" y2="386.3"/>
        <line x1="560" y1="358" x2="588.3" y2="329.7"/>
        <line x1="560" y1="358" x2="531.7" y2="386.3"/>
        <line x1="560" y1="358" x2="531.7" y2="329.7"/>
      </g>
      <circle cx="560" cy="358" r="5.5" fill="#5c5f66"/>
      <circle cx="560" cy="358" r="2.4" fill="#8a8d93"/>
    </g>

    <!-- 车架 -->
    <path d="M 300 358 L 368 266 M 368 266 L 405 368 M 368 266 L 538 262 M 405 368 L 538 262 M 300 358 L 405 368 M 538 262 L 560 358 M 538 262 L 534 246"
          stroke="#d23b3b" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 350 261 Q 370 252 390 261 L 385 268 L 355 268 Z" fill="#2b2b2b"/>
    <path d="M 534 246 Q 519 241 506 248" stroke="#2b2b2b" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <circle cx="506" cy="248" r="3.4" fill="#1f1f1f"/>
    <g transform="rotate(-38.4 475 321)">
      <rect x="469" y="311" width="12" height="20" rx="3" fill="#2fa3a0"/>
      <rect x="471" y="308" width="8" height="5" rx="2" fill="#1d7a78"/>
    </g>

    <!-- 链轮 / 飞轮 / 链条 -->
    <circle cx="405" cy="368" r="24" fill="none" stroke="#4b4d52" stroke-width="3"/>
    <circle cx="405" cy="368" r="3" fill="#4b4d52"/>
    <circle cx="300" cy="358" r="10" fill="none" stroke="#6a6d73" stroke-width="2"/>
    <path id="chain" d="M 405 344 L 300 348 A 10 10 0 0 0 300 368 L 405 392 A 24 24 0 0 0 405 344 Z"
          fill="none" stroke="#3c3e43" stroke-width="3.4" stroke-dasharray="9 5"/>

    <!-- 近侧曲柄 + 踏板 + 脚 -->
    <g id="nearPlate">
      <line x1="405" y1="368" x2="439" y2="368" stroke="#3d3d3d" stroke-width="5"/>
      <rect x="424" y="365" width="30" height="6" rx="3" fill="#454545"/>
      <ellipse cx="439" cy="359.5" rx="8" ry="5" fill="#e69332"/>
    </g>
    <g id="nearLeg">
      <path id="nearThigh" d="" stroke="#f4a23c" stroke-width="15" stroke-linecap="round" fill="none"/>
      <path id="nearCalf"  d="" stroke="#f4a23c" stroke-width="9.5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- 鹈鹕 -->
    <g id="pelican">
      <path d="M 296 244 L 256 268 L 292 262 Z" fill="#e9e7df"/>
      <path d="M 398 200 C 416 182, 434 172, 452 168 L 458 182 C 440 190, 420 200, 408 220 Z" fill="#f7f6f1"/>
      <path d="M 300 262 C 286 240, 298 200, 336 188 C 372 176, 404 192, 412 218 C 418 244, 404 262, 372 270 C 348 274, 318 272, 300 262 Z" fill="#f7f6f1"/>
      <g id="wingB">
        <path d="M 320 214 C 348 198, 386 200, 398 214 C 384 238, 344 246, 318 236 C 312 228, 314 220, 320 214 Z"
              fill="#e6e3d9" stroke="#cfcabb" stroke-width="1.2"/>
      </g>
      <path d="M 396 210 C 428 216, 462 226, 500 240 L 509 247 C 462 251, 420 239, 394 226 Z"
            fill="#eceade" stroke="#d5d0c2" stroke-width="1"/>
      <circle cx="507" cy="247" r="5" fill="#e6e2d6"/>
      <g id="headG">
        <circle cx="454" cy="168" r="17" fill="#f7f6f1"/>
        <path d="M 447 153 L 451 141 L 455 152 L 459 144 L 462 154 Z" fill="#efede4"/>
        <path d="M 458 158 L 556 171 Q 562 174 556 178 L 458 182 Z" fill="#f2a01d"/>
        <path d="M 458 180 L 552 177 Q 556 180 552 183 Q 505 210 458 188 Z" fill="#ffc842"/>
        <circle cx="452" cy="161" r="4.6" fill="#ffffff" stroke="#4a4a4a" stroke-width="0.8"/>
        <circle cx="453.4" cy="161" r="2.1" fill="#1c1c1c"/>
      </g>
    </g>
  </svg>
  <p class="caption">鹈鹕正悠闲地踩着踏板 —— 纯 SVG 绘制，CSS + JavaScript 驱动，无外部依赖。</p>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const BB  = {x:405, y:368};      // 五通（曲柄轴心）
  const HIP = {x:372, y:274};      // 髋关节
  const CRANK = 34, FOOT_RAISE = 7;
  const L1 = 70, L2 = 66;         // 大腿 / 小腿长度
  const OMEGA_C = 3.0;            // 曲柄角速度 rad/s
  const OMEGA_W = OMEGA_C * 24 / 58;  // 车轮角速度（按链传动比）
  const CHAIN_V = OMEGA_C * 24;   // 链条线速度 px/s
  const TAU = Math.PI * 2, D2R = 180 / Math.PI;
  let chainOff = 0, last = null;

  // 脚踝位置：踏板轴再向上抬 7px
  const ankle = th => {
    const c = Math.cos(th), s = Math.sin(th);
    return { x: BB.x + CRANK*c + FOOT_RAISE*s, y: BB.y + CRANK*s - FOOT_RAISE*c };
  };

  // 由髋、脚两点解膝部位置（两圆交点）
  function setLeg(prefix, A){
    const dx = A.x - HIP.x, dy = A.y - HIP.y;
    const d = Math.hypot(dx, dy) || 1e-6;
    const ux = dx/d, uy = dy/d;
    const a = (L1*L1 - L2*L2 + d*d) / (2*d);
    const h = Math.sqrt(Math.max(0, L1*L1 - a*a));
    const kx = HIP.x + a*ux + h*uy, ky = HIP.y + a*uy - h*ux;
    $(prefix+'Thigh').setAttribute('d', `M ${HIP.x} ${HIP.y} L ${kx.toFixed(2)} ${ky.toFixed(2)}`);
    $(prefix+'Calf').setAttribute('d', `M ${kx.toFixed(2)} ${ky.toFixed(2)} L ${A.x.toFixed(2)} ${A.y.toFixed(2)}`);
  }

  function render(t, dt){
    const thc = OMEGA_C * t, thf = thc + Math.PI;
    $('nearPlate').setAttribute('transform', `rotate(${(thc*D2R).toFixed(3)} ${BB.x} ${BB.y})`);
    $('farPlate').setAttribute('transform', `rotate(${(thf*D2R).toFixed(3)} ${BB.x} ${BB.y})`);
    setLeg('near', ankle(thc));
    setLeg('far',  ankle(thf));
    const dw = ((OMEGA_W * t) % TAU) * D2R;
    $('spokesB').setAttribute('transform', `rotate(${dw.toFixed(3)} 300 358)`);
    $('spokesF').setAttribute('transform', `rotate(${dw.toFixed(3)} 560 358)`);
    // 车身随踏板轻微起伏
    const bx = 1.2*Math.cos(2*thc - 0.5), by = 2.0*Math.sin(2*thc);
    $('pelican').setAttribute('transform', `translate(${bx.toFixed(2)} ${by.toFixed(2)})`);
    $('wingB').setAttribute('transform', `rotate(${(3.5*Math.sin(2*thc + 1.2)).toFixed(3)} 396 212)`);
    $('headG').setAttribute('transform', `rotate(${(1.6*Math.sin(2*thc + 0.8)).toFixed(3)} 454 168)`);
    if (dt > 0) chainOff += CHAIN_V * dt;
    $('chain').setAttribute('stroke-dashoffset', chainOff.toFixed(2));
  }

  if (matchMedia('(prefers-reduced-motion: reduce)').matches){ render(0.35, 0); return; }
  const tick = now => {
    const dt = last === null ? 0 : Math.min(0.05, (now - last)/1000);
    last = now;
    render(now/1000, dt);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
